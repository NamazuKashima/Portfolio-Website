<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Portfolio Editor</title>
<meta name="robots" content="noindex, nofollow"/>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000a02;--s1:#0c0c0c;--s2:#121412;--s3:#1a1d19;
  --border:#252925;--border2:#373c38;
  --fg:#fcfaf2;--fg2:#bcb09c;--fg3:#85916d;
  --accent:#769164;--accent-d:rgba(118,145,100,.14);
  --green:#22c55e;--red:#ef4444;
  --ff:'Zen Kaku Gothic New',sans-serif;--fd:'Inter Tight',sans-serif;
  --r:4px;--t:0.2s ease;
}
html,body{height:100%;overflow:hidden;font-family:var(--ff);background:var(--bg);color:var(--fg);font-size:14px}
button,input,textarea,select{font-family:var(--ff);font-size:14px}
/* ── LAYOUT ─────────────────────────────────────────── */
.e-header{
  height:52px;display:flex;align-items:center;justify-content:space-between;
  padding:0 1.25rem;border-bottom:1px solid var(--border);
  background:var(--s1);flex-shrink:0;position:relative;z-index:10;
}
.e-logo{font-family:var(--fd);font-size:1.3rem;font-weight:700;color:var(--fg)}
.e-header-center{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:.75rem}
.save-status{font-size:.72rem;font-weight:600;letter-spacing:.06em}
.save-status.clean{color:var(--green)}
.save-status.dirty{color:var(--fg3)}
.e-actions{display:flex;gap:.5rem}
.btn{padding:.45rem 1rem;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--border2);background:var(--s2);color:var(--fg2);cursor:pointer;border-radius:var(--r);transition:var(--t)}
.btn:hover{border-color:var(--fg3);color:var(--fg)}
.btn.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.btn-accent:hover{background:transparent;color:var(--accent)}
.btn.btn-ghost{background:none;border-color:transparent;color:var(--fg3)}
.btn.btn-ghost:hover{color:var(--fg);border-color:var(--border)}
.btn.btn-connected{border-color:var(--green);color:var(--green)}
.btn.btn-connected:hover{background:var(--green);color:#fff}
.btn.btn-pending{border-color:#e0a53f;color:#e0a53f}

.e-body{display:flex;height:calc(100vh - 52px);overflow:hidden}

/* ── SIDEBAR ────────────────────────────────────────── */
.e-sidebar{
  width:240px;flex-shrink:0;border-right:1px solid var(--border);
  background:var(--s1);overflow-y:auto;display:flex;flex-direction:column;
}
.sidebar-section{padding:.75rem 0;border-bottom:1px solid var(--border)}
.sidebar-section:last-child{border-bottom:none;flex:1}
.sidebar-label{
  font-size:.62rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--fg3);padding:.4rem 1rem .4rem 1rem;
}
.nav-item{
  display:flex;align-items:center;gap:.6rem;
  padding:.45rem 1rem;font-size:.8rem;font-weight:500;color:var(--fg2);
  cursor:pointer;transition:var(--t);border-left:2px solid transparent;
  user-select:none;
}
.nav-item:hover{color:var(--fg);background:var(--s2)}
.nav-item.active{color:var(--fg);background:var(--s2);border-left-color:var(--accent)}
.nav-item-icon{font-size:.85rem;width:16px;text-align:center;flex-shrink:0;opacity:.7}

/* Portfolio tree */
.tree-collection{margin-bottom:.25rem}
.tree-coll-header{
  display:flex;align-items:center;gap:.4rem;
  padding:.4rem .75rem .4rem 1rem;cursor:pointer;
  font-size:.78rem;font-weight:600;color:var(--fg2);
  user-select:none;transition:var(--t);
}
.tree-coll-header:hover{color:var(--fg);background:var(--s2)}
.tree-coll-header.active{color:var(--fg);background:var(--s2);border-left:2px solid var(--accent)}
.tree-arrow{font-size:.6rem;transition:transform var(--t);opacity:.5;flex-shrink:0}
.tree-arrow.open{transform:rotate(90deg)}
.tree-coll-name{flex:1;font-size:.78rem}
.tree-works{padding-left:1.5rem;display:none}
.tree-works.open{display:block}
.tree-work{
  display:flex;align-items:center;gap:.35rem;
  padding:.35rem .5rem;cursor:pointer;border-radius:var(--r);
  font-size:.75rem;color:var(--fg3);transition:var(--t);
  border-left:2px solid transparent;
}
.tree-work:hover{color:var(--fg2);background:var(--s2)}
.tree-work.active{color:var(--fg);background:var(--s3);border-left-color:var(--accent)}
.tree-work-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-work-del,.tree-work-dup{
  opacity:0;font-size:.75rem;color:var(--fg3);background:none;border:none;
  cursor:pointer;padding:.1rem .25rem;border-radius:2px;line-height:1;
  transition:var(--t);flex-shrink:0;
}
.tree-work:hover .tree-work-del,
.tree-work:hover .tree-work-dup{opacity:.6}
.tree-work-del:hover{color:var(--red);opacity:1 !important}
.tree-work-dup:hover{color:var(--green);opacity:1 !important}
.tree-add-work{
  display:flex;align-items:center;gap:.4rem;padding:.3rem .5rem;
  font-size:.72rem;font-weight:600;letter-spacing:.04em;color:var(--fg3);
  cursor:pointer;border-radius:var(--r);transition:var(--t);
  background:none;border:none;width:100%;text-align:left;
}
.tree-add-work:hover{color:var(--accent);background:var(--accent-d)}
.tree-add-coll{
  display:flex;align-items:center;gap:.4rem;padding:.4rem 1rem;
  font-size:.72rem;font-weight:600;letter-spacing:.04em;color:var(--fg3);
  cursor:pointer;transition:var(--t);background:none;border:none;width:100%;text-align:left;
}
.tree-add-coll:hover{color:var(--accent)}

/* ── PANEL ──────────────────────────────────────────── */
.e-panel{flex:1;overflow-y:auto;display:flex;justify-content:center;padding:2.5rem 2rem}
.e-panel>*{width:100%;max-width:560px}
.panel-title{
  font-family:var(--fd);font-size:2rem;font-weight:700;
  letter-spacing:-.02em;margin-bottom:.25rem;color:var(--fg);
}
.panel-sub{font-size:.8rem;color:var(--fg3);margin-bottom:2rem}
.panel-divider{height:1px;background:var(--border);margin:1.75rem 0}
.panel-section-title{
  font-size:.62rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--fg3);margin-bottom:1.1rem;
}

/* Fields */
.field-group{margin-bottom:1.1rem}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.field-label{
  display:block;font-size:.65rem;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--fg3);margin-bottom:.4rem;
}
.field-input{
  width:100%;background:var(--s1);border:1px solid var(--border2);
  color:var(--fg);padding:.65rem .8rem;border-radius:var(--r);
  outline:none;transition:border-color var(--t);resize:vertical;
  font-size:.85rem;
}
.field-input:focus{border-color:var(--accent)}
.field-input::placeholder{color:var(--fg3)}
textarea.field-input{min-height:90px;line-height:1.6}

/* Tags */
.tags-wrap{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.tag-chip{
  display:flex;align-items:center;gap:.3rem;
  background:var(--s3);border:1px solid var(--border2);
  color:var(--fg2);font-size:.7rem;padding:.25rem .5rem;border-radius:var(--r);
}
.tag-del{
  background:none;border:none;color:var(--fg3);cursor:pointer;
  font-size:.85rem;line-height:1;padding:0;transition:color var(--t);
}
.tag-del:hover{color:var(--red)}
.tag-input-inline{
  background:none;border:none;outline:none;color:var(--fg2);
  font-size:.72rem;min-width:80px;
}
.tag-input-inline::placeholder{color:var(--fg3)}

/* Image upload */
.img-upload-zone{
  position:relative;width:100%;aspect-ratio:16/9;
  background:var(--s2);border:1px dashed var(--border2);border-radius:var(--r);
  overflow:hidden;cursor:pointer;transition:border-color var(--t);
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:.5rem;
}
.img-upload-zone:hover{border-color:var(--accent)}
.img-upload-zone img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.img-upload-overlay{
  position:absolute;inset:0;background:rgba(0,0,0,.55);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.4rem;
  opacity:0;transition:opacity var(--t);
}
.img-upload-zone:hover .img-upload-overlay{opacity:1}
.img-upload-hint{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg2)}
.img-empty-label{font-size:.72rem;color:var(--fg3);letter-spacing:.06em;text-transform:uppercase}
.img-empty-icon{font-size:1.8rem;opacity:.15}
.img-url-row{display:flex;gap:.5rem;margin-top:.6rem}
.img-url-row .field-input{flex:1}
.img-clear-btn{
  padding:.65rem .85rem;background:var(--s2);border:1px solid var(--border2);
  color:var(--fg3);border-radius:var(--r);cursor:pointer;font-size:.75rem;
  transition:var(--t);white-space:nowrap;
}
.img-clear-btn:hover{color:var(--red);border-color:var(--red)}

/* Skills editor */
.skills-editor{display:flex;flex-direction:column;gap:1.25rem}
.skill-cat-block{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:1rem}
.skill-cat-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.75rem}
.skill-cat-input{flex:1;background:none;border:none;color:var(--fg);font-size:.85rem;font-weight:600;outline:none}
.skill-cat-del{background:none;border:none;color:var(--fg3);cursor:pointer;font-size:1rem;transition:color var(--t)}
.skill-cat-del:hover{color:var(--red)}
.skill-items{display:flex;flex-direction:column;gap:.4rem}
.skill-item-row{display:flex;gap:.4rem;align-items:center}
.skill-item-input{flex:1;background:var(--s2);border:1px solid var(--border);color:var(--fg2);padding:.4rem .6rem;border-radius:var(--r);font-size:.8rem;outline:none;transition:border-color var(--t)}
.skill-item-input:focus{border-color:var(--accent)}
.skill-item-del{background:none;border:none;color:var(--fg3);cursor:pointer;font-size:.85rem;transition:color var(--t);padding:.2rem}
.skill-item-del:hover{color:var(--red)}
.skill-add-item{
  background:none;border:1px dashed var(--border2);color:var(--fg3);
  padding:.35rem .7rem;border-radius:var(--r);cursor:pointer;font-size:.72rem;
  transition:var(--t);width:100%;text-align:left;margin-top:.25rem;
}
.skill-add-item:hover{color:var(--accent);border-color:var(--accent)}
.add-skill-cat{
  display:flex;align-items:center;gap:.4rem;background:none;border:1px dashed var(--border2);
  color:var(--fg3);padding:.5rem 1rem;border-radius:var(--r);cursor:pointer;
  font-size:.72rem;font-weight:600;transition:var(--t);width:100%;text-align:left;
}
.add-skill-cat:hover{color:var(--accent);border-color:var(--accent)}

/* Experience editor */
.exp-list{display:flex;flex-direction:column;gap:1rem}
.exp-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.exp-card-header{
  display:flex;align-items:center;gap:.5rem;padding:.75rem 1rem;
  cursor:pointer;border-bottom:1px solid var(--border);background:var(--s2);
}
.exp-card-period{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);flex-shrink:0}
.exp-card-title{flex:1;font-size:.82rem;font-weight:600;color:var(--fg)}
.exp-card-toggle{color:var(--fg3);font-size:.7rem;transition:transform var(--t)}
.exp-card-toggle.open{transform:rotate(180deg)}
.exp-card-body{padding:1rem;display:none}
.exp-card-body.open{display:block}
.exp-del-row{margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border)}

/* Bio editor */
.bio-list{display:flex;flex-direction:column;gap:.75rem;margin-bottom:.75rem}
.bio-item-row{display:flex;gap:.5rem;align-items:flex-start}
.bio-del{background:none;border:none;color:var(--fg3);cursor:pointer;font-size:.9rem;transition:color var(--t);padding:.35rem;margin-top:.25rem}
.bio-del:hover{color:var(--red)}

/* Danger zone */
.danger-zone{
  margin-top:2rem;padding:1rem 1.25rem;border:1px solid rgba(239,68,68,.2);
  border-radius:var(--r);background:rgba(239,68,68,.04);
}
.danger-title{font-size:.62rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:.75rem;opacity:.7}
.btn-danger{
  background:none;border:1px solid rgba(239,68,68,.3);color:var(--red);
  padding:.45rem 1rem;border-radius:var(--r);cursor:pointer;font-size:.72rem;
  font-weight:700;letter-spacing:.06em;text-transform:uppercase;transition:var(--t);
}
.btn-danger:hover{background:rgba(239,68,68,.1);border-color:var(--red)}

/* Work order btns */
.work-order-btns{display:flex;gap:.25rem;flex-shrink:0}
.order-btn{
  background:none;border:1px solid var(--border);color:var(--fg3);
  padding:.15rem .4rem;border-radius:2px;cursor:pointer;font-size:.65rem;line-height:1.2;
  transition:var(--t);
}
.order-btn:hover{border-color:var(--fg3);color:var(--fg)}

/* Photo upload + crop */
.photo-row{display:flex;gap:1.25rem;align-items:flex-start}
.photo-preview{
  width:128px;height:160px;flex-shrink:0;
  background:var(--s2);border:1px solid var(--border2);border-radius:var(--r);
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  cursor:pointer;position:relative;transition:border-color var(--t);
}
.photo-preview:hover{border-color:var(--accent)}
.photo-preview img{width:100%;height:100%;object-fit:cover}
.photo-preview .ph-empty{font-size:.65rem;color:var(--fg3);text-transform:uppercase;letter-spacing:.08em;text-align:center;padding:.5rem}
.photo-actions{display:flex;flex-direction:column;gap:.5rem}
.photo-hint{font-size:.72rem;color:var(--fg3);line-height:1.5;max-width:280px}

/* Theme panel */
.theme-row{
  display:grid;grid-template-columns:26px 1fr;gap:.75rem;
  align-items:start;padding:.85rem 0;border-bottom:1px solid var(--border);
}
.theme-swatch{
  width:26px;height:26px;border-radius:3px;
  border:1px solid var(--border2);display:block;margin-top:2px;
}
.theme-info{min-width:0}
.theme-label{font-size:.82rem;font-weight:600;color:var(--fg)}
.theme-note{font-size:.7rem;color:var(--fg3);margin-top:.1rem}
.theme-ctrls{grid-column:2;display:flex;gap:.4rem;margin-top:.55rem;align-items:center}
/* preset picker (custom, so swatches are actually visible) */
.preset-wrap{position:relative;flex:1;min-width:0}
.preset-btn{
  width:100%;display:flex;align-items:center;gap:.5rem;
  background:var(--s1);border:1px solid var(--border2);color:var(--fg2);
  padding:.4rem .55rem;border-radius:var(--r);font-size:.75rem;
  cursor:pointer;text-align:left;transition:border-color var(--t);
}
.preset-btn:hover{border-color:var(--fg3)}
.preset-btn .pb-sw{
  width:14px;height:14px;border-radius:2px;flex-shrink:0;
  border:1px solid rgba(255,255,255,.18);
}
.preset-btn .pb-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preset-btn .pb-caret{font-size:.6rem;opacity:.5;flex-shrink:0}

.preset-pop{
  display:none;position:absolute;z-index:50;top:calc(100% + 4px);left:0;
  width:min(420px,78vw);max-height:300px;overflow-y:auto;
  background:var(--s2);border:1px solid var(--border2);border-radius:var(--r);
  padding:.4rem;box-shadow:0 10px 30px rgba(0,0,0,.6);
}
.preset-pop.open{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.preset-item{
  display:flex;align-items:center;gap:.5rem;padding:.35rem .45rem;
  border-radius:2px;cursor:pointer;font-size:.72rem;color:var(--fg2);
  background:none;border:none;text-align:left;width:100%;
  transition:background var(--t);
}
.preset-item:hover{background:var(--s3);color:var(--fg)}
.preset-item.active{background:var(--s3);color:var(--accent)}
.preset-sw{
  width:20px;height:20px;border-radius:2px;flex-shrink:0;
  border:1px solid rgba(255,255,255,.18);
}
.preset-nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preset-hx{font-size:.62rem;color:var(--fg3);font-family:ui-monospace,monospace;flex-shrink:0}
.theme-hex{
  width:88px;flex-shrink:0;background:var(--s1);border:1px solid var(--border2);
  color:var(--fg);padding:.4rem .5rem;border-radius:var(--r);
  font-size:.75rem;font-family:ui-monospace,monospace;outline:none;
}
.theme-hex:focus{border-color:var(--accent)}
.theme-pick{
  width:34px;height:31px;flex-shrink:0;padding:0;border:1px solid var(--border2);
  border-radius:var(--r);background:var(--s1);cursor:pointer;
}

/* Washi slider */
.washi-row{display:flex;align-items:center;gap:.7rem}
.washi-range{flex:1;accent-color:var(--accent);cursor:pointer}
.washi-cap{font-size:.66rem;color:var(--fg3);letter-spacing:.1em;text-transform:uppercase;flex-shrink:0}
.washi-val{font-size:.75rem;color:var(--accent);font-weight:700;width:42px;text-align:right;flex-shrink:0}

/* CV block */
.cv-status{
  font-size:.75rem;padding:.65rem .8rem;border-radius:var(--r);
  border:1px solid var(--border2);background:var(--s1);margin-bottom:.6rem;
  word-break:break-all;line-height:1.5;
}
.cv-status.empty{color:var(--fg3)}
.cv-status.ok{color:var(--accent);border-color:rgba(118,145,100,.35)}
.cv-btn-row{display:flex;gap:.5rem}

.crop-modal{
  position:fixed;inset:0;z-index:500;display:none;
  align-items:center;justify-content:center;
}
.crop-modal.open{display:flex}
.crop-backdrop{position:absolute;inset:0;background:rgba(0,10,2,.9);backdrop-filter:blur(6px)}
.crop-card{
  position:relative;z-index:2;background:var(--s1);border:1px solid var(--border2);
  border-radius:var(--r);padding:1.5rem;max-width:92vw;
  display:inline-block;
}
.crop-title{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--fg2);margin-bottom:1rem}
.crop-frame{
  position:relative;margin:0 auto 1rem;max-width:100%;
  overflow:hidden;background:#000;border:1px solid var(--border2);
  cursor:grab;touch-action:none;user-select:none;
}
.crop-frame.dragging{cursor:grabbing}
.crop-frame img{position:absolute;pointer-events:none;max-width:none}
.crop-grid{
  position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(to right,transparent 33%,rgba(255,255,255,.08) 33.4%,transparent 33.8%,transparent 66%,rgba(255,255,255,.08) 66.4%,transparent 66.8%),
    linear-gradient(to bottom,transparent 33%,rgba(255,255,255,.08) 33.4%,transparent 33.8%,transparent 66%,rgba(255,255,255,.08) 66.4%,transparent 66.8%);
}
.crop-zoom-row{display:flex;align-items:center;gap:.75rem;margin-bottom:1.25rem}
.crop-zoom-row label{font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);flex-shrink:0}
.crop-zoom{flex:1;accent-color:var(--accent)}
.crop-btns{display:flex;gap:.5rem;justify-content:flex-end}

/* Toast */
#toast{
  position:fixed;bottom:1.5rem;right:1.5rem;
  background:var(--s3);border:1px solid var(--border2);color:var(--fg);
  padding:.6rem 1.25rem;border-radius:var(--r);font-size:.78rem;font-weight:600;
  opacity:0;transform:translateY(8px);transition:.25s ease;pointer-events:none;z-index:999;
}
#toast.show{opacity:1;transform:translateY(0)}
#toast.success{border-color:var(--green);color:var(--green)}
#toast.error{border-color:var(--red);color:var(--red)}

/* Scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--s1)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
</style>
</head>
<body>

<!-- HEADER -->
<header class="e-header">
  <div class="e-logo">V. Editor</div>
  <div class="e-header-center">
    <span class="save-status clean" id="saveStatus">✓ Saved</span>
  </div>
  <div class="e-actions">
    <button class="btn btn-ghost" id="btnPreview">⌥ Preview</button>
    <button class="btn" id="btnConnect">🔗 Connect Folder</button>
    <button class="btn" id="btnImport">↑ Import</button>
    <button class="btn" id="btnExport">↓ Export data.js</button>
    <button class="btn btn-accent" id="btnSave">Save</button>
  </div>
</header>

<div class="e-body">
  <!-- SIDEBAR -->
  <nav class="e-sidebar" id="sidebar"></nav>
  <!-- PANEL -->
  <main class="e-panel" id="panel"></main>
</div>

<div id="toast"></div>

<!-- Load the published content file so the editor always has the real data available -->

function init() {
  // Priority: 1) published js/data.js — whatever is actually in this folder
  // right now  2) saved browser draft, only if there is no file to read at
  // all  3) built-in defaults.
  // The draft used to come first, which meant a stale leftover from a past
  // session (or a different project) could silently shadow real content on
  // disk. Disk always wins now; the draft is only a last-resort fallback,
  // and gets fully synced (or cleared) below once a real source is found.
  var published = window.PORTFOLIO_FILE_DATA || window.PORTFOLIO_DATA;
  var source     = 'defaults';

  try {
    if (published && published.portfolio) {
      DATA = JSON.parse(JSON.stringify(published));
      source = 'file';
    } else {
      var saved        = localStorage.getItem('portfolio_data');
      var savedVersion = localStorage.getItem('portfolio_data_version');
      if (saved && savedVersion === DATA_VERSION) {
        DATA = JSON.parse(saved);
        source = 'draft';
      } else {
        DATA = JSON.parse(JSON.stringify(DEFAULTS));
        localStorage.removeItem('portfolio_data');
        localStorage.setItem('portfolio_data_version', DATA_VERSION);
      }
    }
  }
  catch(e) {
    DATA = published && published.portfolio
      ? JSON.parse(JSON.stringify(published))
      : JSON.parse(JSON.stringify(DEFAULTS));
    source = published ? 'file' : 'defaults';
  }

  // Keep the draft mirrored to whatever we just loaded, so it can never
  // resurface and override a fresher file on the next reload.
  if (source !== 'draft') {
    try {
      localStorage.setItem('portfolio_data', JSON.stringify(DATA));
      localStorage.setItem('portfolio_data_version', DATA_VERSION);
    } catch (e) { /* best-effort */ }
  }

  // expand all collections by default
  if (DATA.portfolio) DATA.portfolio.forEach(function(c) { expandedColls[c.id] = true; });

  renderSidebar();
  navigate('general');

  // close any open colour popup when clicking elsewhere
  document.addEventListener('click', function() {
    document.querySelectorAll('.preset-pop.open').forEach(function(p){ p.classList.remove('open'); });
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') document.querySelectorAll('.preset-pop.open').forEach(function(p){ p.classList.remove('open'); });
  });

  document.getElementById('btnSave').onclick    = save;
  document.getElementById('btnExport').onclick  = exportData;
  document.getElementById('btnImport').onclick  = importData;
  document.getElementById('btnPreview').onclick = function() { window.open('index.html','_blank'); };
  document.getElementById('btnConnect').onclick = function() {
    if (pendingHandle) reconnectFolder(); else connectFolder();
  };
  updateConnectionUI();
  initFolderConnection();

  if (source === 'file')     showToast('Loaded content from js/data.js', 'success');
  if (source === 'defaults') showToast('No saved content found — showing sample data', 'error');
}

// Pulls the content object out of a data.js file's text, whatever wrapper
// format it's in (current FILE_DATA form, legacy PORTFOLIO_DATA form, or
// plain JSON). Shared by manual Import and the direct-from-folder read.
function parseDataJsText(text) {
  var obj = null;
  try {
    obj = JSON.parse(text);
  } catch (err) {
    var m = text.match(/var\s+FILE_DATA\s*=\s*(\{[\s\S]*?\});\s*\n\s*var\s+data/);
    if (!m) m = text.match(/window\.PORTFOLIO_DATA\s*=\s*(\{[\s\S]*?\});\s*\n?\s*window\.PORTFOLIO_DEFAULTS/);
    if (!m) m = text.match(/window\.PORTFOLIO_DATA\s*=\s*(\{[\s\S]*\})\s*;/);
    if (m) { try { obj = JSON.parse(m[1]); } catch (e2) { obj = null; } }
  }
  return (obj && obj.portfolio) ? obj : null;
}

// Reads js/data.js straight off disk through the connected folder handle —
// bypasses the page's own <script src> entirely, so it can never show a
// version cached from an earlier page load.
async function readDataJsFromFolder(handle) {
  try {
    var jsDir      = await handle.getDirectoryHandle('js');
    var fileHandle = await jsDir.getFileHandle('data.js');
    var file        = await fileHandle.getFile();
    var text        = await file.text();
    return parseDataJsText(text);
  } catch (e) { return null; }
}

// Re-reads data.js from the connected folder and swaps it in as the live
// DATA. Called right after connecting/reconnecting, and silently again on
// every page load once a folder is already connected, so what you see in
// the editor always matches what is actually on disk.
async function loadFromDiskAndApply(opts) {
  opts = opts || {};
  if (!dirHandle) return;
  var obj = await readDataJsFromFolder(dirHandle);
  if (!obj) {
    if (!opts.silent) showToast('⚠ Connected, but could not read js/data.js from that folder', 'error');
    return;
  }
  DATA = obj;
  expandedColls = {};
  DATA.portfolio.forEach(function (c) { expandedColls[c.id] = true; });
  try {
    localStorage.setItem('portfolio_data', JSON.stringify(DATA));
    localStorage.setItem('portfolio_data_version', DATA_VERSION);
  } catch (e) { /* best-effort */ }
  dirty = false;
  var s = document.getElementById('saveStatus');
  if (s) { s.textContent = '✓ Saved'; s.className = 'save-status clean'; }
  navigate(VIEW.section || 'general', VIEW.collId, VIEW.workId);
  if (!opts.silent) showToast('✓ Loaded latest data.js from "' + dirHandle.name + '"', 'success');
}

// ═══════════════════════════════════════════════════════
//  IMPORT (load a data.js / .json file manually)
// ═══════════════════════════════════════════════════════
function importData() {
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.js,.json,application/json,text/javascript';
  inp.onchange = function() {
    var file = inp.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      var text = e.target.result;
      var obj = parseDataJsText(text);
      if (!obj || !obj.portfolio) { showToast('✕ Could not read that file', 'error'); return; }
      DATA = obj;
      expandedColls = {};
      DATA.portfolio.forEach(function(c) { expandedColls[c.id] = true; });
      save();
      renderSidebar();
      navigate('general');
      showToast('✓ Content imported', 'success');
    };
    reader.readAsText(file);
  };
  inp.click();
}

// ═══════════════════════════════════════════════════════
//  SAVE / DIRTY
// ═══════════════════════════════════════════════════════
function markDirty() {
  dirty = true;
  var s = document.getElementById('saveStatus');
  s.textContent = '● Unsaved changes';
  s.className = 'save-status dirty';
  clearTimeout(autoSaveTimer);
  // Connected: auto-write straight to disk a beat after typing stops — no
  // export/import round trip. Not connected: fall back to the browser draft.
  autoSaveTimer = setTimeout(function() {
    if (dirHandle) saveToFolder({ interactive: false });
    else save();
  }, 1500);
}

function save() {
  var s = document.getElementById('saveStatus');
  try {
    localStorage.setItem('portfolio_data', JSON.stringify(DATA));
    localStorage.setItem('portfolio_data_version', DATA_VERSION);
    // verify write actually landed
    if (localStorage.getItem('portfolio_data') === null) throw new Error('write failed');
    dirty = false;
    s.textContent = '✓ Saved';
    s.className = 'save-status clean';
    showToast('✓ Saved successfully', 'success');
  } catch (err) {
    s.textContent = '✕ Save failed';
    s.className = 'save-status dirty';
    var msg = '✕ Save failed';
    if (err && (err.name === 'QuotaExceededError' || String(err).indexOf('quota') > -1)) {
      msg = '✕ Save failed: storage full (images too large — try smaller files)';
    }
    showToast(msg, 'error');
  }
}

/* Splits the content in two:
   - any image or PDF still held as base64 is written out as a real file
   - data.js is emitted with paths pointing at those files
   Shared by the direct-to-disk save and the manual download-based export. */
function buildExportPayload() {
  var out = JSON.parse(JSON.stringify(DATA));
  var files = [];                       // { path, blob }

  var EXT = { 'image/jpeg':'jpg', 'image/png':'png', 'image/webp':'webp',
              'image/gif':'gif', 'application/pdf':'pdf' };

  function slug(s) {
    return String(s || '').toLowerCase()
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '')
      .replace(/-+/g, '-').slice(0, 48) || 'untitled';
  }

  // Names already spoken for — both files being written now and paths that
  // are already on disk — so a truncated title can never overwrite another.
  var taken = {};
  function uniqueName(folder, base, ext) {
    var name = base, n = 2;
    while (taken[folder + '/' + name + '.' + ext]) name = base + '-' + (n++);
    taken[folder + '/' + name + '.' + ext] = true;
    return name;
  }

  function toFile(dataUrl, folder, name) {
    var m = /^data:([^;]+);base64,(.*)$/.exec(dataUrl || '');
    if (!m) {                            // already a path — reserve it, keep it
      if (dataUrl) taken[dataUrl] = true;
      return dataUrl;
    }
    var mime = m[1], b64 = m[2];
    var bin  = atob(b64);
    var buf  = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    var ext  = EXT[mime] || 'bin';
    var path = folder + '/' + uniqueName(folder, name, ext) + '.' + ext;
    files.push({ path: path, blob: new Blob([buf], { type: mime }) });
    return path;
  }

  // First pass: reserve every path that already exists on disk.
  out.portfolio.forEach(function (coll) {
    coll.works.forEach(function (w) {
      if (w.coverImage && w.coverImage.indexOf('data:') !== 0) taken[w.coverImage] = true;
    });
  });
  if (out.about) {
    if (out.about.photo && out.about.photo.indexOf('data:') !== 0) taken[out.about.photo] = true;
    if (out.about.cvUrl && out.about.cvUrl.indexOf('data:') !== 0) taken[out.about.cvUrl] = true;
  }

  // Second pass: write out anything still held as base64.
  out.portfolio.forEach(function (coll) {
    coll.works.forEach(function (w) {
      w.coverImage = toFile(w.coverImage, 'assets/works', coll.id + '-' + slug(w.title));
    });
  });
  if (out.about) {
    out.about.photo = toFile(out.about.photo, 'assets', 'portrait');
    out.about.cvUrl = toFile(out.about.cvUrl, 'assets/doc',
                             slug((out.about.cvFileName || 'cv').replace(/\.[^.]+$/, '')));
  }

  var content =
    '// Portfolio Content Data\n' +
    '// Generated by Portfolio Editor — ' + new Date().toLocaleDateString() + '\n' +
    '// Save this file as js/data.js in your portfolio folder.\n' +
    '//\n' +
    '// Images and the CV live as real files under assets/ — this file only holds\n' +
    '// their paths, so the browser can fetch them in parallel and cache them.\n' +
    '//\n' +
    '// Live preview: if an unsaved draft exists in this browser (created by the\n' +
    '// editor), it takes priority so index.html reflects edits immediately.\n' +
    '// Visitors have no draft, so they always see the published content below.\n\n' +
    '(function () {\n' +
    '  var FILE_DATA = ' + JSON.stringify(out, null, 2) + ';\n\n' +
    '  var data = FILE_DATA;\n' +
    '  try {\n' +
    "    var draft = localStorage.getItem('portfolio_data');\n" +
    '    if (draft) {\n' +
    '      var parsed = JSON.parse(draft);\n' +
    '      if (parsed && parsed.portfolio) data = parsed;\n' +
    '    }\n' +
    '  } catch (e) { /* ignore unreadable draft */ }\n\n' +
    '  // A draft may still hold base64 blobs — fall back to the published paths\n' +
    '  // so the site never shows a broken image.\n' +
    '  try {\n' +
    '    if (data !== FILE_DATA) {\n' +
    '      var byId = {};\n' +
    '      FILE_DATA.portfolio.forEach(function (c) {\n' +
    '        c.works.forEach(function (w) { byId[w.id] = w.coverImage; });\n' +
    '      });\n' +
    '      (data.portfolio || []).forEach(function (c) {\n' +
    '        (c.works || []).forEach(function (w) {\n' +
    "          if ((w.coverImage || '').indexOf('data:') === 0 && byId[w.id]) w.coverImage = byId[w.id];\n" +
    '        });\n' +
    '      });\n' +
    "      if ((data.about.photo || '').indexOf('data:') === 0) data.about.photo = FILE_DATA.about.photo;\n" +
    "      if ((data.about.cvUrl || '').indexOf('data:') === 0) data.about.cvUrl = FILE_DATA.about.cvUrl;\n" +
    '    }\n' +
    '  } catch (e) { /* best-effort */ }\n\n' +
    '  window.PORTFOLIO_DATA      = data;\n' +
    '  window.PORTFOLIO_FILE_DATA = FILE_DATA;\n' +
    '  window.PORTFOLIO_DEFAULTS  = FILE_DATA;\n' +
    '})();\n';

  // Which files on disk are no longer referenced? Deleted works, replaced
  // covers and renamed uploads all leave their old file behind.
  function assetPaths(d) {
    var out = [];
    (d.portfolio || []).forEach(function (c) {
      (c.works || []).forEach(function (w) {
        if (w.coverImage && w.coverImage.indexOf('data:') !== 0) out.push(w.coverImage);
      });
    });
    if (d.about) {
      if (d.about.photo && d.about.photo.indexOf('data:') !== 0) out.push(d.about.photo);
      if (d.about.cvUrl && d.about.cvUrl.indexOf('data:') !== 0) out.push(d.about.cvUrl);
    }
    return out;
  }

  var published = window.PORTFOLIO_FILE_DATA || {};
  var before  = assetPaths(published);
  var after   = assetPaths(out);
  var orphans = before.filter(function (p) { return after.indexOf(p) === -1; });

  // A manifest so none of this has to be remembered (manual export path only)
  var manifest =
    'Portfolio export — ' + new Date().toLocaleString() + '\n' +
    '='.repeat(52) + '\n\n' +
    '1. Replace js/data.js with the downloaded data.js\n\n' +
    (files.length
      ? '2. Add these ' + files.length + ' file(s):\n' +
        files.map(function (f) { return '     ' + f.path; }).join('\n') + '\n\n'
      : '2. No new files — every asset was already on disk.\n\n') +
    (orphans.length
      ? '3. These ' + orphans.length + ' file(s) are no longer used and can be deleted:\n' +
        orphans.map(function (p) { return '     ' + p; }).join('\n') + '\n'
      : '3. Nothing to delete — no orphaned files.\n');

  return { out: out, files: files, content: content, manifest: manifest, orphans: orphans };
}

// Copies resolved (base64 → file path) values from a cloned payload back
// onto the live DATA graph without replacing any object identities, so
// fields already bound to work/about objects in the open panel keep working.
function applyResolvedPaths(live, resolved) {
  var byId = {};
  (resolved.portfolio || []).forEach(function (c) {
    (c.works || []).forEach(function (w) { byId[w.id] = w.coverImage; });
  });
  (live.portfolio || []).forEach(function (c) {
    (c.works || []).forEach(function (w) {
      if (Object.prototype.hasOwnProperty.call(byId, w.id)) w.coverImage = byId[w.id];
    });
  });
  if (live.about && resolved.about) {
    live.about.photo = resolved.about.photo;
    live.about.cvUrl = resolved.about.cvUrl;
  }
}

/* Manual fallback — downloads data.js + any new asset files individually.
   Used automatically when the browser can't do direct folder access
   (Firefox, Safari), or any time from the toolbar as a backup. */
function exportData() {
  var pkg = buildExportPayload();

  function download(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  download(new Blob([pkg.content], { type: 'text/javascript' }), 'data.js');

  // Browsers throttle rapid downloads, so stagger the asset files.
  pkg.files.forEach(function (f, i) {
    setTimeout(function () {
      download(f.blob, f.path.split('/').pop());
    }, 400 + i * 250);
  });

  download(new Blob([pkg.manifest], { type: 'text/plain' }), 'EXPORT-README.txt');

  console.log(pkg.manifest);
  var msg = '✓ Exported data.js';
  if (pkg.files.length)   msg += ' + ' + pkg.files.length + ' file(s) to add';
  if (pkg.orphans.length) msg += ' · ' + pkg.orphans.length + ' unused file(s) to delete';
  showToast(msg + ' — see EXPORT-README.txt', 'success');
}

// ═══════════════════════════════════════════════════════
//  DIRECT-TO-DISK SAVING (File System Access API)
//  Connect the project folder once; after that every edit writes
//  js/data.js and any newly uploaded image straight to disk — no
//  download, no manual drag-and-drop.
// ═══════════════════════════════════════════════════════
var dirHandle     = null;   // live, permission-granted handle
var pendingHandle = null;   // remembered handle awaiting re-permission after reload

function folderApiSupported() { return 'showDirectoryPicker' in window; }

function idbOpen() {
  return new Promise(function (resolve, reject) {
    var req = indexedDB.open('portfolio-editor', 1);
    req.onupgradeneeded = function () { req.result.createObjectStore('handles'); };
    req.onsuccess = function () { resolve(req.result); };
    req.onerror   = function () { reject(req.error); };
  });
}
function idbSet(key, val) {
  return idbOpen().then(function (db) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction('handles', 'readwrite');
      tx.objectStore('handles').put(val, key);
      tx.oncomplete = function () { resolve(); };
      tx.onerror    = function () { reject(tx.error); };
    });
  });
}
function idbGet(key) {
  return idbOpen().then(function (db) {
    return new Promise(function (resolve, reject) {
      var tx  = db.transaction('handles', 'readonly');
      var req = tx.objectStore('handles').get(key);
      req.onsuccess = function () { resolve(req.result || null); };
      req.onerror   = function () { reject(req.error); };
    });
  });
}

function updateConnectionUI() {
  var btn     = document.getElementById('btnConnect');
  var saveBtn = document.getElementById('btnSave');
  btn.classList.remove('btn-connected', 'btn-pending');
  if (dirHandle) {
    btn.textContent = '🔗 ' + dirHandle.name;
    btn.title = 'Connected — saves write straight to this folder. Click to switch folders.';
    btn.classList.add('btn-connected');
    saveBtn.textContent = '💾 Save to Folder';
    saveBtn.onclick = function () { saveToFolder({ interactive: true }); };
  } else if (pendingHandle) {
    btn.textContent = '⚠ Reconnect Folder';
    btn.title = 'Click to re-grant access to "' + pendingHandle.name + '" (browsers ask again after a restart).';
    btn.classList.add('btn-pending');
    saveBtn.textContent = 'Save';
    saveBtn.onclick = save;
  } else {
    btn.textContent = '🔗 Connect Folder';
    btn.title = 'Pick your portfolio folder once — after that, Save writes data.js and images directly to disk.';
    saveBtn.textContent = 'Save';
    saveBtn.onclick = save;
  }
}

async function connectFolder() {
  if (!folderApiSupported()) {
    showToast('✕ This browser can\'t access folders directly — use Export instead', 'error');
    return;
  }
  try {
    var handle = await window.showDirectoryPicker({ id: 'portfolio-root', mode: 'readwrite' });
    var perm = await handle.requestPermission({ mode: 'readwrite' });
    if (perm !== 'granted') { showToast('✕ Permission denied', 'error'); return; }

    var looksRight = true;
    try { await handle.getFileHandle('index.html'); }
    catch (e) { looksRight = false; }
    if (!looksRight && !confirm('This folder doesn\'t contain an index.html — pick it anyway?')) return;

    dirHandle = handle;
    pendingHandle = null;
    try { await idbSet('dirHandle', handle); } catch (e) { /* persistence best-effort */ }
    updateConnectionUI();
    showToast('✓ Connected to "' + handle.name + '" — edits now save directly', 'success');
    await loadFromDiskAndApply({ silent: true }); // pull its real data.js in immediately
  } catch (err) {
    if (err && err.name !== 'AbortError') showToast('✕ Could not connect folder', 'error');
  }
}

async function reconnectFolder() {
  if (!pendingHandle) return connectFolder();
  try {
    var perm = await pendingHandle.requestPermission({ mode: 'readwrite' });
    if (perm === 'granted') {
      dirHandle = pendingHandle;
      pendingHandle = null;
      updateConnectionUI();
      showToast('✓ Reconnected to "' + dirHandle.name + '"', 'success');
      await loadFromDiskAndApply({ silent: true }); // in case the file changed since last session
    } else {
      showToast('✕ Permission denied', 'error');
    }
  } catch (e) {
    showToast('✕ Could not reconnect — pick the folder again', 'error');
    connectFolder();
  }
}

async function initFolderConnection() {
  if (!folderApiSupported() || !('indexedDB' in window)) return;
  try {
    var handle = await idbGet('dirHandle');
    if (!handle) return;
    var perm = await handle.queryPermission({ mode: 'readwrite' });
    if (perm === 'granted') {
      dirHandle = handle;
      updateConnectionUI();
      // Already connected from a past session — quietly re-sync against
      // whatever is on disk right now instead of trusting the page's own
      // script-tag load, which could be an older cached copy.
      await loadFromDiskAndApply({ silent: true });
      return;
    } else {
      pendingHandle = handle;
    }
  } catch (e) { /* stale/revoked handle — ignore, stays disconnected */ }
  updateConnectionUI();
}

async function writeFileToHandle(root, path, data) {
  var parts = path.split('/');
  var filename = parts.pop();
  var dir = root;
  for (var i = 0; i < parts.length; i++) dir = await dir.getDirectoryHandle(parts[i], { create: true });
  var fileHandle = await dir.getFileHandle(filename, { create: true });
  var writable = await fileHandle.createWritable();
  await writable.write(data);
  await writable.close();
}

async function deleteFileFromHandle(root, path) {
  var parts = path.split('/');
  var filename = parts.pop();
  var dir = root;
  for (var i = 0; i < parts.length; i++) {
    try { dir = await dir.getDirectoryHandle(parts[i]); }
    catch (e) { return; }
  }
  try { await dir.removeEntry(filename); } catch (e) { /* already gone */ }
}

async function saveToFolder(opts) {
  opts = opts || {};
  if (!dirHandle) return connectFolder();

  var perm = await dirHandle.queryPermission({ mode: 'readwrite' });
  if (perm !== 'granted') {
    perm = await dirHandle.requestPermission({ mode: 'readwrite' });
    if (perm !== 'granted') {
      showToast('✕ Permission needed to save — click Connect Folder again', 'error');
      return;
    }
  }

  try {
    var pkg = buildExportPayload();

    await writeFileToHandle(dirHandle, 'js/data.js', new Blob([pkg.content], { type: 'text/javascript' }));
    for (var i = 0; i < pkg.files.length; i++) {
      await writeFileToHandle(dirHandle, pkg.files[i].path, pkg.files[i].blob);
    }

    var deleted = 0;
    if (pkg.orphans.length && opts.interactive) {
      var doDelete = confirm(
        pkg.orphans.length + ' file(s) are no longer used:\n\n' +
        pkg.orphans.join('\n') + '\n\nDelete them from the folder now?'
      );
      if (doDelete) {
        for (var j = 0; j < pkg.orphans.length; j++) {
          await deleteFileFromHandle(dirHandle, pkg.orphans[j]);
        }
        deleted = pkg.orphans.length;
      }
    }

    // Now that the files are really on disk, point the live editor state at
    // them too — same as export, but there is no download to wait on.
    // Mutate DATA in place rather than replacing it: the currently rendered
    // panel's fields hold closures over the existing work/about objects, and
    // swapping in pkg.out's cloned objects would silently disconnect them
    // from further edits.
    applyResolvedPaths(DATA, pkg.out);
    localStorage.setItem('portfolio_data', JSON.stringify(DATA));
    localStorage.setItem('portfolio_data_version', DATA_VERSION);
    dirty = false;
    var s = document.getElementById('saveStatus');
    s.textContent = '✓ Saved'; s.className = 'save-status clean';
    // Refresh so image fields flip from base64 to the real file path — but
    // never while a text field has focus, or a background autosave would
    // yank the cursor out from under whatever the user is about to type.
    var active = document.activeElement;
    var isTyping = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA');
    if (!isTyping) renderPanel();

    var msg = '✓ Saved to "' + dirHandle.name + '"';
    if (pkg.files.length) msg += ' · ' + pkg.files.length + ' new file(s)';
    if (deleted)           msg += ' · ' + deleted + ' unused file(s) removed';
    showToast(msg, 'success');
  } catch (err) {
    console.error(err);
    showToast('✕ Save failed: ' + (err && err.message ? err.message : err), 'error');
  }
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + (type || '');
  clearTimeout(t._timer);
  t._timer = setTimeout(function() { t.className = ''; }, type === 'error' ? 4500 : 2500);
}

function navigate(section, collId, workId) {

  renderSidebar();
  renderPanel();
}

// ═══════════════════════════════════════════════════════
//  SIDEBAR
// ═══════════════════════════════════════════════════════
function renderSidebar() {
  var sb = document.getElementById('sidebar');
  sb.innerHTML = '';

  // Nav items
  var navItems = [
    { id: 'general',    icon: '⚙', label: 'General' },
    { id: 'hero',       icon: '◉', label: 'Hero' },
    { id: 'about',      icon: '◎', label: 'About' },
  ];

  var top = el('div', 'sidebar-section');
  navItems.forEach(function(item) {
    top.appendChild(navItem(item));
  });
  sb.appendChild(top);

  // Portfolio tree
  var portSection = el('div', 'sidebar-section');
  portSection.appendChild(elText('div', 'sidebar-label', 'Portfolio'));

  var tree = el('div', 'tree');
  (DATA.portfolio || []).forEach(function(coll, ci) {
    tree.appendChild(makeCollNode(coll, ci));
  });

  var addCollBtn = el('button', 'tree-add-coll');
  addCollBtn.innerHTML = '+ Add Collection';
  addCollBtn.onclick = function() {
    var id = 'coll-' + Date.now();
    DATA.portfolio.push({ id: id, name: 'New Collection', works: [] });
    expandedColls[id] = true;
    markDirty();
    navigate('collection', id);
  };
  tree.appendChild(addCollBtn);
  portSection.appendChild(tree);
  sb.appendChild(portSection);

  // Bottom nav
  var bottom = el('div', 'sidebar-section');
  [{ id:'experience', icon:'◈', label:'Experience' },
   { id:'contact',    icon:'◇', label:'Contact' },
   { id:'footer',     icon:'▤', label:'Logo & Footer' },
   { id:'theme',      icon:'◐', label:'Theme & Colors' }].forEach(function(item) {
    bottom.appendChild(navItem(item));
  });
  sb.appendChild(bottom);
}

function navItem(item) {
  var active = VIEW.section === item.id && !VIEW.workId && !VIEW.collId;
  var div = el('div', 'nav-item' + (active ? ' active' : ''));
  div.innerHTML = '<span class="nav-item-icon">' + item.icon + '</span>' + item.label;
  div.onclick = function() { navigate(item.id); };
  return div;
}

function makeCollNode(coll, ci) {
  var expanded = !!expandedColls[coll.id];
  var activeIsThisColl = VIEW.section === 'collection' && VIEW.collId === coll.id && !VIEW.workId;

  var wrapper = el('div', 'tree-collection');

  var header = el('div', 'tree-coll-header' + (activeIsThisColl ? ' active' : ''));
  var arrow  = el('span', 'tree-arrow' + (expanded ? ' open' : ''), '▶');
  var nameEl = el('span', 'tree-coll-name', coll.name);

  header.appendChild(arrow);
  header.appendChild(nameEl);

  header.onclick = function(e) {
    if (e.target === arrow || e.target === nameEl || e.target === header) {
      expandedColls[coll.id] = !expandedColls[coll.id];
      navigate('collection', coll.id);
    }
  };
  wrapper.appendChild(header);

  var worksDiv = el('div', 'tree-works' + (expanded ? ' open' : ''));

  (coll.works || []).forEach(function(work, wi) {
    var activeWork = VIEW.section === 'work' && VIEW.collId === coll.id && VIEW.workId === work.id;
    var row = el('div', 'tree-work' + (activeWork ? ' active' : ''));

    var orderBtns = el('div', 'work-order-btns');
    var upBtn = el('button', 'order-btn', '↑');
    upBtn.title = 'Move up';
    upBtn.onclick = function(e) {
      e.stopPropagation();
      if (wi === 0) return;
      coll.works.splice(wi - 1, 0, coll.works.splice(wi, 1)[0]);
      markDirty();
      navigate('work', coll.id, work.id);
    };
    var dnBtn = el('button', 'order-btn', '↓');
    dnBtn.title = 'Move down';
    dnBtn.onclick = function(e) {
      e.stopPropagation();
      if (wi >= coll.works.length - 1) return;
      coll.works.splice(wi + 1, 0, coll.works.splice(wi, 1)[0]);
      markDirty();
      navigate('work', coll.id, work.id);
    };
    orderBtns.appendChild(upBtn);
    orderBtns.appendChild(dnBtn);

    var titleEl = el('span', 'tree-work-title', work.title || 'Untitled');
    var dupBtn  = el('button', 'tree-work-dup', '⎘');
    dupBtn.title = 'Duplicate';
    dupBtn.onclick = function(e) {
      e.stopPropagation();
      duplicateWork(coll, wi);
    };
    var delBtn  = el('button', 'tree-work-del', '×');
    delBtn.title = 'Delete';
    delBtn.onclick = function(e) {
      e.stopPropagation();
      if (!confirm('Delete "' + (work.title || 'Untitled') + '"?')) return;
      coll.works.splice(wi, 1);
      markDirty();
      navigate('collection', coll.id);
    };

    row.appendChild(orderBtns);
    row.appendChild(titleEl);
    row.appendChild(dupBtn);
    row.appendChild(delBtn);
    row.onclick = function() { navigate('work', coll.id, work.id); };
    worksDiv.appendChild(row);
  });

  var addBtn = el('button', 'tree-add-work');
  addBtn.innerHTML = '+ Add Work';
  addBtn.onclick = function() {
    var wid = coll.id + '-' + Date.now();
    var newWork = { id: wid, title: 'New Work', year: new Date().getFullYear().toString(), role: '', description: '', tags: [], coverImage: '', links: { live: '', case_study: '' } };
    coll.works.push(newWork);
    expandedColls[coll.id] = true;
    markDirty();
    navigate('work', coll.id, wid);
  };
  worksDiv.appendChild(addBtn);
  wrapper.appendChild(worksDiv);
  return wrapper;
}

//  PANELS
// ═══════════════════════════════════════════════════════
function renderPanel() {
  var panel = document.getElementById('panel');
  panel.innerHTML = '';

  switch (VIEW.section) {
    case 'general':    panel.appendChild(panelGeneral());    break;
    case 'hero':       panel.appendChild(panelHero());       break;
    case 'about':      panel.appendChild(panelAbout());      break;
    case 'collection': panel.appendChild(panelCollection()); break;
    case 'work':       panel.appendChild(panelWork());       break;
    case 'experience': panel.appendChild(panelExperience()); break;
    case 'contact':    panel.appendChild(panelContact());    break;
    case 'footer':     panel.appendChild(panelFooter());     break;
    case 'theme':      panel.appendChild(panelTheme());      break;
    default:           panel.innerHTML = '<p style="color:var(--fg3);padding:2rem">Select a section from the sidebar.</p>';
  }
}

/* ── ABOUT ───────────────────────────────────────────── */
function panelAbout() {
  var d = el('div');
  d.appendChild(elText('div','panel-title','About'));
  d.appendChild(elText('div','panel-sub','Photo, bio and skills'));
  d.appendChild(divider());

  // ── Profile photo
  d.appendChild(elText('div','panel-section-title','Profile Photo'));
  var photoRow = el('div','photo-row');

  var preview = el('div','photo-preview');
  function updatePreview() {
    preview.innerHTML = DATA.about.photo
      ? '<img src="' + DATA.about.photo + '" alt="Profile"/>'
      : '<span class="ph-empty">No photo<br/>Click to upload</span>';
  }
  updatePreview();

  var photoFileInp = el('input');
  photoFileInp.type = 'file';
  photoFileInp.accept = 'image/*';
  photoFileInp.style.display = 'none';
  photoFileInp.addEventListener('change', function() {
    var file = photoFileInp.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
      openCropModal(e.target.result, function(croppedDataUrl) {
        DATA.about.photo = croppedDataUrl;
        updatePreview();
        markDirty();
      });
      photoFileInp.value = '';
    };
    reader.readAsDataURL(file);
  });
  preview.onclick = function() { photoFileInp.click(); };

  var actions = el('div','photo-actions');
  var upBtn = el('button','btn','Upload Photo');
  upBtn.onclick = function() { photoFileInp.click(); };
  var rmBtn = el('button','btn','Remove');
  rmBtn.onclick = function() {
    DATA.about.photo = '';
    updatePreview();
    markDirty();
  };
  var hint = el('div','photo-hint','After upload you can zoom and drag to crop. Displayed at 4:5 ratio on the site.');
  actions.appendChild(upBtn);
  actions.appendChild(rmBtn);
  actions.appendChild(hint);

  photoRow.appendChild(preview);
  photoRow.appendChild(actions);
  d.appendChild(photoRow);
  d.appendChild(photoFileInp);

  d.appendChild(divider());

  // ── CV / Resume
  if (!DATA.about.cvLabel)    DATA.about.cvLabel    = 'Download CV';
  if (!DATA.about.cvFileName) DATA.about.cvFileName = 'CV.pdf';

  d.appendChild(elText('div','panel-section-title','CV / Resume'));

  var cvStatus = el('div','cv-status');
  function fmtSize(bytes) {
    return bytes > 1048576 ? (bytes/1048576).toFixed(1) + ' MB'
                           : Math.round(bytes/1024) + ' KB';
  }
  function updateCvStatus() {
    var v = DATA.about.cvUrl || '';
    if (!v) {
      cvStatus.className = 'cv-status empty';
      cvStatus.textContent = 'No CV uploaded — the button stays hidden on the site.';
    } else if (v.indexOf('data:') === 0) {
      var bytes = Math.round((v.length - v.indexOf(',') - 1) * 0.75);
      cvStatus.className = 'cv-status ok';
      cvStatus.textContent = '✓ Embedded file · ' + (DATA.about.cvFileName || 'CV.pdf') + ' · ' + fmtSize(bytes);
    } else {
      cvStatus.className = 'cv-status ok';
      cvStatus.textContent = '✓ Linked file · ' + v;
    }
  }
  updateCvStatus();

  var cvFileInp = el('input');
  cvFileInp.type = 'file';
  cvFileInp.accept = 'application/pdf,.pdf,.doc,.docx';
  cvFileInp.style.display = 'none';
  cvFileInp.addEventListener('change', function() {
    var file = cvFileInp.files[0];
    if (!file) return;
    if (file.size > 4 * 1024 * 1024) {
      showToast('✕ File too large (' + fmtSize(file.size) + ') — keep it under 4 MB', 'error');
      cvFileInp.value = '';
      return;
    }
    var reader = new FileReader();

  cvUpBtn.onclick = function() { cvFileInp.click(); };
  var cvRmBtn = el('button','btn','Remove');

      ta.value       = para;
      ta.rows         = 3;
      ta.style.flex   = '1';

      var delBtn = el('button','bio-del','×');

        DATA.about.bio.splice(i, 1);
        markDirty();
        rebuildBio();
      };

      row.appendChild(delBtn);

  var addBioBtn = el('button','skill-add-item','+ Add paragraph');

    DATA.about.bio.push('');
    markDirty();
    rebuildBio();
  };
  d.appendChild(addBioBtn);

  d.appendChild(divider());
  d.appendChild(elText('div','panel-section-title','Skills'));

  var skillsWrap = el('div','skills-editor');

  function rebuildSkills() {
    skillsWrap.innerHTML = '';
    DATA.about.skills.forEach(function(cat, ci) {
      var block  = el('div','skill-cat-block');

      var catInp = el('input','skill-cat-input');

      catInp.addEventListener('input', function() { DATA.about.skills[ci].category = catInp.value; markDirty(); });
      var catDel = el('button','skill-cat-del','×');
      catDel.onclick = function() {
        DATA.about.skills.splice(ci,1);
        markDirty();
        rebuildSkills();
      };
      hdr.appendChild(catInp);
      hdr.appendChild(catDel);
      block.appendChild(hdr);

      var items = el('div','skill-items');
      cat.items.forEach(function(item, ii) {
        var row = el('div','skill-item-row');
        var inp = el('input','skill-item-input');
        inp.value = item;
        inp.addEventListener('input', function() { DATA.about.skills[ci].items[ii] = inp.value; markDirty(); });
        var del = el('button','skill-item-del','×');
        del.onclick = function() {
          DATA.about.skills[ci].items.splice(ii,1);
          markDirty();
          rebuildSkills();
        };
        row.appendChild(inp);
        row.appendChild(del);
        items.appendChild(row);
      });
      var addItem = el('button','skill-add-item','+ Add item');

        rebuildSkills();

  rebuildSkills();

  return d;

/* ── WORK ────────────────────────────────────────────── */
function panelWork() {
  var coll = (DATA.portfolio || []).find(function(c) { return c.id === VIEW.collId; });
  var work = coll && coll.works.find(function(w) { return w.id === VIEW.workId; });
  if (!work) return elText('div','','Work not found.');

  var d = el('div');
  d.appendChild(elText('div','panel-title', work.title || 'Untitled Work'));
  d.appendChild(elText('div','panel-sub', coll.name + ' · ' + (work.year || '—')));
  d.appendChild(divider());

  // ── Cover image
  d.appendChild(elText('div','panel-section-title','Cover Image'));
  var zone = el('div','img-upload-zone');
  zone.id = 'imgZone-' + work.id;

  function updateZone() {
    zone.innerHTML = '';
    if (work.coverImage) {
      var img = el('img');
      img.src = work.coverImage;
      zone.appendChild(img);
      var ov = el('div','img-upload-overlay');
      ov.innerHTML = '<span class="img-upload-hint">Change Image</span>';
      zone.appendChild(ov);
    } else {
      zone.innerHTML = '<span class="img-empty-icon">⬚</span><span class="img-empty-label">Click to upload image</span>';
    }
  }
  updateZone();

  var fileInp = el('input');
  fileInp.type   = 'file';
  fileInp.accept = 'image/*';
  fileInp.style.display = 'none';
  fileInp.addEventListener('change', function() {
    var file = fileInp.files[0];
    if (!file) return;
    zone.style.opacity = '0.5';
    // downscale first (keeps crop preview fast + memory low), then open 16:9 cropper
    compressImage(file, 2400, 0.92, function(dataUrl) {
      zone.style.opacity = '';
      fileInp.value = '';
      if (!dataUrl) { showToast('✕ Failed to process image', 'error'); return; }
      openCropModal(dataUrl, function(cropped) {
        work.coverImage = cropped;
        updateZone();
        updateUrlField();
        markDirty();
      }, {
        frameW: 480, frameH: 270,     // 16:9 preview frame
        outW:  1600, outH:  900,      // 16:9 output
        title: 'Crop Cover — drag to move, slider to zoom (16:9)'
      });
    });
  });
  zone.onclick = function() { fileInp.click(); };
  d.appendChild(zone);
  d.appendChild(fileInp);

  var urlRow = el('div','img-url-row');
  var urlInp = el('input','field-input');
  urlInp.placeholder = 'Or paste image URL (https://...)';
  urlInp.id = 'imgUrlInp-' + work.id;

  function updateUrlField() {
    urlInp.value = (work.coverImage && !work.coverImage.startsWith('data:')) ? work.coverImage : '';
  }
  updateUrlField();

  urlInp.addEventListener('input', function() {
    var v = urlInp.value.trim();
    if (v && !v.startsWith('data:')) {
      work.coverImage = v;
      updateZone();
      markDirty();
    }
  });

  var clearBtn = el('button','img-clear-btn','Remove');
  clearBtn.onclick = function() {
    work.coverImage = '';
    urlInp.value = '';
    updateZone();
    markDirty();
  };
  urlRow.appendChild(urlInp);
  urlRow.appendChild(clearBtn);
  d.appendChild(urlRow);

  d.appendChild(divider());
  d.appendChild(elText('div','panel-section-title','Details'));

  // Fields
  var titleFg = field('Title', work.title, function(v) {
    work.title = v;
    markDirty();
    // Update sidebar + panel title live
    document.querySelector('.panel-title').textContent = v || 'Untitled Work';
    var activeTree = document.querySelector('.tree-work.active .tree-work-title');
    if (activeTree) activeTree.textContent = v || 'Untitled';
  });
  d.appendChild(titleFg);

  var metaRow = el('div','field-row');
  metaRow.appendChild(field('Year', work.year, function(v) { work.year = v; markDirty(); }));
  metaRow.appendChild(field('Role', work.role, function(v) { work.role = v; markDirty(); }));
  d.appendChild(metaRow);

  d.appendChild(field('Description', work.description, function(v) { work.description = v; markDirty(); }, 'textarea'));

  // Tags
  d.appendChild(divider());
  d.appendChild(elText('div','panel-section-title','Tags'));
  d.appendChild(makeTags(work));

  // Links
  d.appendChild(divider());
  d.appendChild(elText('div','panel-section-title','Links'));
  d.appendChild(field('Watch / Live URL',  work.links.live,       function(v) { work.links.live       = v; markDirty(); }));
  d.appendChild(field('More Info URL (IMDb, project page…)', work.links.case_study, function(v) { work.links.case_study = v; markDirty(); }));

  // Duplicate
  d.appendChild(divider());
  var dupRow = el('div');
  dupRow.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:.85rem 1rem;background:var(--s1);border:1px solid var(--border);border-radius:var(--r)';
  var dupInfo = el('div');
  dupInfo.innerHTML = '<div style="font-size:.8rem;font-weight:600;color:var(--fg)">Duplicate Work</div><div style="font-size:.72rem;color:var(--fg3);margin-top:.15rem">Creates a copy with all fields preserved</div>';
  var dupBtn2 = el('button','btn','⎘ Duplicate');
  dupBtn2.style.cssText = 'flex-shrink:0;color:var(--green);border-color:rgba(34,197,94,.3)';
  dupBtn2.onclick = function() {
    var wi = coll.works.findIndex(function(w) { return w.id === work.id; });
    duplicateWork(coll, wi);
  };
  dupRow.appendChild(dupInfo);
  dupRow.appendChild(dupBtn2);
  d.appendChild(dupRow);

  // Danger zone
  var dz = el('div','danger-zone');
  dz.appendChild(elText('div','danger-title','Danger Zone'));
  var delBtn = el('button','btn-danger','Delete This Work');
  delBtn.onclick = function() {
    if (!confirm('Delete "' + (work.title || 'Untitled') + '"?')) return;
    coll.works = coll.works.filter(function(w) { return w.id !== work.id; });
    markDirty();
    navigate('collection', coll.id);
  };
  dz.appendChild(delBtn);
  d.appendChild(dz);

  return d;
}

/* ── THEME & COLORS ──────────────────────────────────── */
function panelTheme() {
  if (!DATA.theme) DATA.theme = JSON.parse(JSON.stringify(DEFAULTS.theme));
  var T = DATA.theme;

  var d = el('div');
  d.appendChild(elText('div','panel-title','Theme & Colors'));
  d.appendChild(elText('div','panel-sub','Every preset is an authentic 日本の伝統色'));
  d.appendChild(divider());

  THEME_TOKENS.forEach(function(tok) {
    var row = el('div','theme-row');

    var sw = el('span','theme-swatch');
    sw.style.background = T[tok.k] || '#000';

    var info = el('div','theme-info');
    info.appendChild(elText('div','theme-label', tok.label));
    info.appendChild(elText('div','theme-note',  tok.note));

    // preset picker — custom popup so every swatch is visible
    var wrap = el('div','preset-wrap');
    var btn  = el('button','preset-btn');
    var bSw  = el('span','pb-sw');
    var bNm  = el('span','pb-name');
    var bCr  = elText('span','pb-caret','▼');
    btn.appendChild(bSw); btn.appendChild(bNm); btn.appendChild(bCr);

    var pop = el('div','preset-pop');
    NIPPON_COLORS.forEach(function(c) {
      var it = el('button','preset-item');
      var sw = el('span','preset-sw'); sw.style.background = c.h;
      it.appendChild(sw);
      it.appendChild(elText('span','preset-nm', c.n));
      it.appendChild(elText('span','preset-hx', c.h));
      it.dataset.hex = c.h;
      it.onclick = function(e) {
        e.stopPropagation();
        set(c.h, 'sel');
        pop.classList.remove('open');
      };
      pop.appendChild(it);
    });

    function syncBtn(v) {
      var m = NIPPON_COLORS.find(function(c){ return c.h.toLowerCase() === (v||'').toLowerCase(); });
      bSw.style.background = v || '#000';
      bNm.textContent = m ? m.n : 'custom';
      pop.querySelectorAll('.preset-item').forEach(function(it) {
        it.classList.toggle('active', it.dataset.hex.toLowerCase() === (v||'').toLowerCase());
      });
    }

    btn.onclick = function(e) {
      e.stopPropagation();
      var wasOpen = pop.classList.contains('open');
      document.querySelectorAll('.preset-pop.open').forEach(function(p){ p.classList.remove('open'); });
      if (!wasOpen) pop.classList.add('open');
    };

    wrap.appendChild(btn);
    wrap.appendChild(pop);

    var hex = el('input','theme-hex');
    hex.type = 'text';
    hex.value = T[tok.k] || '';
    hex.spellcheck = false;

    var pick = el('input','theme-pick');
    pick.type = 'color';
    pick.value = /^#[0-9a-f]{6}$/i.test(T[tok.k]||'') ? T[tok.k] : '#000000';

    function set(v, from) {
      if (!/^#[0-9a-f]{6}$/i.test(v)) return;
      T[tok.k] = v.toLowerCase();
      sw.style.background = v;
      if (from !== 'hex')  hex.value  = v.toLowerCase();
      if (from !== 'pick') pick.value = v;
      syncBtn(v);
      applyLivePreview();
      markDirty();
    }
    hex.addEventListener('input',  function(){ set(hex.value.trim(),'hex'); });
    pick.addEventListener('input', function(){ set(pick.value,'pick'); });
    syncBtn(T[tok.k]);

    var ctrls = el('div','theme-ctrls');
    ctrls.appendChild(wrap);
    ctrls.appendChild(hex);
    ctrls.appendChild(pick);

    row.appendChild(sw);
    row.appendChild(info);
    row.appendChild(ctrls);
    d.appendChild(row);
  });

  // ── washi texture
  d.appendChild(divider());
  d.appendChild(elText('div','panel-section-title','和紙 Washi Texture'));

  var wRow  = el('div','washi-row');
  var wVal  = elText('span','washi-val', Math.round((T.washiOpacity ?? 0.4) * 100) + '%');
  var wIn   = el('input','washi-range');
  wIn.type = 'range'; wIn.min = '0'; wIn.max = '100'; wIn.step = '5';
  wIn.value = String(Math.round((T.washiOpacity ?? 0.4) * 100));
  wIn.addEventListener('input', function() {
    T.washiOpacity = Number(wIn.value) / 100;
    wVal.textContent = wIn.value + '%';
    applyLivePreview();
    markDirty();
  });
  wRow.appendChild(elText('span','washi-cap','Off'));
  wRow.appendChild(wIn);
  wRow.appendChild(elText('span','washi-cap','Strong'));
  wRow.appendChild(wVal);
  d.appendChild(wRow);
  d.appendChild(el('div','photo-hint','Paper grain over the whole page. Around 40% is subtle; above 70% it starts to read as visible texture.'));

  // ── reset
  d.appendChild(divider());
  var resetBtn = el('button','btn','↺ Reset to default palette');
  resetBtn.onclick = function() {
    if (!confirm('Reset all colors and texture to the default 伝統色 palette?')) return;
    DATA.theme = JSON.parse(JSON.stringify(DEFAULTS.theme));
    applyLivePreview();
    markDirty();
    renderPanel();
    showToast('✓ Palette reset', 'success');
  };
  d.appendChild(resetBtn);

  return d;
}

/* Live-preview the palette inside the editor chrome itself */
function applyLivePreview() {
  var T = DATA.theme; if (!T) return;
  var r = document.documentElement;
  r.style.setProperty('--accent', T.accent || '#3f7735');
  r.style.setProperty('--fg',     T.fg     || '#fcfaf2');
}

// ═══════════════════════════════════════════════════════
//  SHARED COMPONENTS
// ═══════════════════════════════════════════════════════
function makeTags(obj) {
  var wrap = el('div','tags-wrap');

  function rebuild() {
    wrap.innerHTML = '';
    (obj.tags || []).forEach(function(tag, ti) {
      var chip = el('div','tag-chip');
      chip.appendChild(document.createTextNode(tag));
      var del = el('button','tag-del','×');
      del.onclick = function() { obj.tags.splice(ti,1); markDirty(); rebuild(); };
      chip.appendChild(del);
      wrap.appendChild(chip);
    });
    var inp = el('input','tag-input-inline');
    inp.placeholder = 'Type & press Enter';
    inp.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && inp.value.trim()) {
        e.preventDefault();
        if (!obj.tags) obj.tags = [];
        obj.tags.push(inp.value.trim());
        markDirty();
        rebuild();
      }
      if (e.key === 'Backspace' && !inp.value && obj.tags && obj.tags.length) {
        obj.tags.pop();
        markDirty();
        rebuild();
      }
    });
    wrap.appendChild(inp);
    setTimeout(function(){ inp.focus(); }, 0);
  }
  rebuild();
  return wrap;
}

function field(label, value, onChange, type) {
  var g   = el('div','field-group');
  var lbl = elText('label','field-label', label);
  var inp = el(type === 'textarea' ? 'textarea' : 'input', 'field-input');
  if (type !== 'textarea') inp.type = 'text';
  inp.value = value || '';
  inp.addEventListener('input', function() { onChange(inp.value); });
  g.appendChild(lbl);
  g.appendChild(inp);
  return g;
}

function divider() { return el('div','panel-divider'); }

function el(tag, cls, html) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function elText(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  e.textContent = text;
  return e;
}

// ═══════════════════════════════════════════════════════
//  IMAGE COMPRESSION (resize + re-encode before storing)
// ═══════════════════════════════════════════════════════
function compressImage(file, maxDim, quality, cb) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var w = img.naturalWidth, h = img.naturalHeight;
      var scale = Math.min(1, maxDim / Math.max(w, h));
      var outW = Math.max(1, Math.round(w * scale));
      var outH = Math.max(1, Math.round(h * scale));
      var canvas = document.createElement('canvas');
      canvas.width = outW; canvas.height = outH;
      var ctx = canvas.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, outW, outH);
      try {
        cb(canvas.toDataURL('image/jpeg', quality));
      } catch (err) {
        cb(null);
      }
    };
    img.onerror = function() { cb(null); };
    img.src = e.target.result;
  };
  reader.onerror = function() { cb(null); };
  reader.readAsDataURL(file);
}

// ═══════════════════════════════════════════════════════
//  CROP MODAL (zoom + drag pan, 4:5 output)
// ═══════════════════════════════════════════════════════
function openCropModal(srcDataUrl, onApply, opts) {
  opts = opts || {};
  var FRAME_W = opts.frameW || 280, FRAME_H = opts.frameH || 350;  // display frame (default 4:5)
  var OUT_W   = opts.outW   || 640, OUT_H   = opts.outH   || 800;  // output resolution
  var TITLE   = opts.title  || 'Crop Photo — drag to move, slider to zoom';

  // build modal once
  var modal = document.getElementById('cropModal');
  if (!modal) {
    modal = el('div','crop-modal');
    modal.id = 'cropModal';
    modal.innerHTML =
      '<div class="crop-backdrop" id="cropBackdrop"></div>' +
      '<div class="crop-card">' +
        '<div class="crop-title">Crop Photo — drag to move, slider to zoom</div>' +
        '<div class="crop-frame" id="cropFrame"><img id="cropImg" draggable="false"/><div class="crop-grid"></div></div>' +
        '<div class="crop-zoom-row"><label>Zoom</label><input type="range" class="crop-zoom" id="cropZoom" min="100" max="300" value="100"/></div>' +
        '<div class="crop-btns">' +
          '<button class="btn" id="cropCancel">Cancel</button>' +
          '<button class="btn btn-accent" id="cropApply">Apply</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(modal);
  }

  var frame = document.getElementById('cropFrame');
  var imgEl = document.getElementById('cropImg');
  var zoomEl = document.getElementById('cropZoom');

  // apply per-call frame size + title
  modal.querySelector('.crop-title').textContent = TITLE;
  frame.style.width  = FRAME_W + 'px';
  frame.style.height = FRAME_H + 'px';

  var natW = 0, natH = 0, baseScale = 1;
  var z = 1, tx = 0, ty = 0;

  var img = new Image();
  img.onload = function() {
    natW = img.naturalWidth;
    natH = img.naturalHeight;
    baseScale = Math.max(FRAME_W / natW, FRAME_H / natH);  // cover
    z = 1; tx = 0; ty = 0;
    zoomEl.value = 100;
    imgEl.src = srcDataUrl;
    layout();
    modal.classList.add('open');
  };
  img.src = srcDataUrl;

  function drawSize() {
    var s = baseScale * z;
    return { w: natW * s, h: natH * s };
  }

  function clamp() {
    var d = drawSize();
    var minX = FRAME_W - d.w, minY = FRAME_H - d.h; // <= 0
    var x = (FRAME_W - d.w) / 2 + tx;
    var y = (FRAME_H - d.h) / 2 + ty;
    if (x > 0) tx -= x;
    if (y > 0) ty -= y;
    if (x < minX) tx += (minX - x);
    if (y < minY) ty += (minY - y);
  }

  function layout() {
    clamp();
    var d = drawSize();
    var x = (FRAME_W - d.w) / 2 + tx;
    var y = (FRAME_H - d.h) / 2 + ty;
    imgEl.style.width  = d.w + 'px';
    imgEl.style.height = d.h + 'px';
    imgEl.style.left   = x + 'px';
    imgEl.style.top    = y + 'px';
  }

  // drag to pan
  var dragging = false, lastX = 0, lastY = 0;
  frame.onpointerdown = function(e) {
    dragging = true;
    lastX = e.clientX; lastY = e.clientY;
    frame.classList.add('dragging');
    frame.setPointerCapture(e.pointerId);
  };
  frame.onpointermove = function(e) {
    if (!dragging) return;
    tx += e.clientX - lastX;
    ty += e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    layout();
  };
  frame.onpointerup = frame.onpointercancel = function(e) {
    dragging = false;
    frame.classList.remove('dragging');
  };

  // zoom slider — keep center stable
  zoomEl.oninput = function() {
    var newZ = zoomEl.value / 100;
    var ratio = newZ / z;
    tx *= ratio; ty *= ratio;
    z = newZ;
    layout();
  };

  // wheel zoom
  frame.onwheel = function(e) {
    e.preventDefault();
    var newZ = Math.min(3, Math.max(1, z + (e.deltaY < 0 ? 0.08 : -0.08)));
    var ratio = newZ / z;
    tx *= ratio; ty *= ratio;
    z = newZ;
    zoomEl.value = Math.round(z * 100);
    layout();
  };

  function cleanup() {
    modal.classList.remove('open');
    frame.onpointerdown = frame.onpointermove = frame.onpointerup = frame.onwheel = null;
    zoomEl.oninput = null;
  }

  document.getElementById('cropCancel').onclick   = cleanup;
  document.getElementById('cropBackdrop').onclick = cleanup;

  document.getElementById('cropApply').onclick = function() {
    var d = drawSize();
    var x = (FRAME_W - d.w) / 2 + tx;
    var y = (FRAME_H - d.h) / 2 + ty;
    var k = OUT_W / FRAME_W;
    var canvas = document.createElement('canvas');
    canvas.width = OUT_W; canvas.height = OUT_H;
    var ctx = canvas.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, x * k, y * k, d.w * k, d.h * k);
    var result = canvas.toDataURL('image/jpeg', 0.88);
    cleanup();
    onApply(result);
    showToast('Photo cropped', 'success');
  };
}

// ═══════════════════════════════════════════════════════
//  DUPLICATE WORK
// ═══════════════════════════════════════════════════════
function duplicateWork(coll, wi) {
  var original = coll.works[wi];
  var copy = JSON.parse(JSON.stringify(original));
  copy.id    = coll.id + '-' + Date.now();
  copy.title = 'Copy of ' + (original.title || 'Untitled');
  coll.works.splice(wi + 1, 0, copy);
  markDirty();
  navigate('work', coll.id, copy.id);
  showToast('Duplicated', 'success');
}

// ═══════════════════════════════════════════════════════
//  START
// ═══════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', init);
</script>
